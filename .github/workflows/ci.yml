name: CI Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XLAI.v.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: XLAI.v.2.0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check:syntax

  integration:
    runs-on: ubuntu-latest
    needs: syntax
    if: ${{ secrets.CI_DATABASE_URL != '' && secrets.CI_OPENAI_API_KEY != '' }}
    defaults:
      run:
        working-directory: XLAI.v.2.0
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY }}
      NODE_ENV: development
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: XLAI.v.2.0/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check:syntax

      - name: Start app for smoke tests
        run: |
          npm start > /tmp/xlai-server.log 2>&1 &
          echo $! > /tmp/xlai-server.pid
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy"
          cat /tmp/xlai-server.log
          exit 1

      - name: Run smoke tests
        run: npm run smoke

      - name: Stop app
        if: always()
        run: |
          if [[ -f /tmp/xlai-server.pid ]]; then
            kill "$(cat /tmp/xlai-server.pid)" || true
          fi

      - name: Run contract tests
        run: npm run test:contracts

      - name: Upload smoke server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xlai-smoke-server-log
          path: /tmp/xlai-server.log
